<div class="auth-page">
  <div class="auth-card auth-card--login">
    <div class="auth-card__header">
      <div class="brand-block">
        <div class="brand-block__icon">
          <lucide-icon class="brand-block__icon-svg" [img]="icons.zap"></lucide-icon>
        </div>
        <h1 class="brand-block__title">Citeria</h1>
        <p class="brand-block__subtitle">Please enter your details to sign in</p>
      </div>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="auth-form"
    >
      <div class="form-field">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-input"
          placeholder="name@example.com"
          formControlName="email"
          autocomplete="email"
          />
      </div>

      <div class="form-field">
        <label class="form-label">Password</label>
        <div class="password-field">
          <input
            [type]="isPasswordVisible() ? 'password' : 'text'"
            class="form-input form-input--with-action"
            placeholder="••••••••"
            formControlName="password"
            autocomplete="current-password"
          />

          <app-button
            class="password-field__toggle"
            [icon]="isPasswordVisible() ? icons.eye : icons.eyeOff"
            ariaLabel="Toggle password visibility"
            variant="icon"
            size="2xs"
            type="button"
            (click)="isPasswordVisible.set(!isPasswordVisible())"
          />
        </div>
        <div class="auth-actions auth-actions--end">
          <a
            [routerLink]="routes.forgotPassword"
            class="auth-link auth-link--small"
          >
            Forgot password?
          </a>
        </div>
      </div>

      <app-button
        text="Login"
        type="submit"
        size="lg"
        fullWidth
        [loading]="isLoading()" />

      <p class="auth-switch">
        Don't have an account?
        <a [routerLink]="routes.register" class="auth-link">
          Sign up
        </a>
      </p>

      <div class="auth-divider">
        <div class="auth-divider__line"></div>
        <span class="auth-divider__text">
          OR CONTINUE WITH
        </span>
        <div class="auth-divider__line"></div>
      </div>

      <app-button
        text="Google"
        image="assets/logos/google-logo.svg"
        type="button"
        variant="outline"
        fullWidth
      />
    </form>
  </div>
</div>
