<aside>
  <header>
    <h3>Citeria</h3>
    <p>EXPERTISE MARKET</p>
  </header>
  <nav>
    @for (item of sidebarData; track item.label) {
      <a [routerLink]="item.path" [class.disabled]="item.disabled">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <footer>
    <span>{{ displayName() }}</span>
    <button matIconButton type="button" aria-label="Logout" (click)="openConfirmDialogToLogout()">
      <mat-icon>logout</mat-icon>
    </button>
  </footer>
</aside>
