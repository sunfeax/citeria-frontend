<div
  class="confirm"
  role="alertdialog"
  aria-labelledby="confirm-title"
  [attr.aria-describedby]="data.message ? 'confirm-msg' : null"
>
  <h2 id="confirm-title" class="confirm__title">{{ data.title }}</h2>
  @if (data.message) {
    <p id="confirm-msg" class="confirm__message">{{ data.message }}</p>
  }

  <div class="confirm__actions">
    <app-button
      [text]="data.cancelText ?? 'Cancel'"
      type="button"
      variant="secondary"
      (click)="onCancel()"
    />
    <app-button
      [text]="data.confirmText ?? 'Confirm'"
      type="button"
      [variant]="confirmVariant"
      (click)="onConfirm()"
    />
  </div>
</div>
